<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Atlantis"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<title>Atlantis</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:#000}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
.press:active{opacity:.85;transform:scale(.98)}
.story-ring{background:linear-gradient(135deg,#a855f7,#ec4899,#f97316)}
.post-card{border-radius:36px;overflow:hidden;background:#f4f4f6;color:#000}
.nav-item{transition:all .15s}.nav-item.active{background:#fff;color:#000}
.view{display:none;flex-direction:column;height:100%;min-height:0}.view.active{display:flex}
.profile-hero{position:absolute;inset:0;background-size:cover;background-position:center top}
.profile-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.25) 40%,rgba(0,0,0,.75) 70%,rgba(0,0,0,.92))}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#111;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s ease}
.sheet.open{transform:translateY(0)}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.chat-bubble-me{background:#a855f7;color:#fff;border-radius:18px 18px 4px 18px}
.chat-bubble-them{background:#1c1c1e;color:#fff;border-radius:18px 18px 18px 4px}
</style>
</head>
<body>
<div id="app">
<div id="view-home" class="view active">
<header class="px-5 pt-4 pb-3 flex items-center justify-between shrink-0" style="padding-top:max(12px,env(safe-area-inset-top))">
<h1 class="text-[28px] font-bold"><span class="bg-gradient-to-r from-[#a855f7] via-[#ec4899] to-[#f97316] bg-clip-text text-transparent">Atlantis</span></h1>
<button onclick="go('notifications')" class="w-10 h-10 rounded-full flex items-center justify-center text-white/80 press relative">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
<span id="notif-dot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
</button>
</header>
<section class="px-5 pb-3 shrink-0">
<p class="text-[13px] text-white/50 mb-2.5 font-medium">Ваши Атласы</p>
<div class="flex gap-4 overflow-x-auto ns" id="stories-row"></div>
</section>
<main class="flex-1 overflow-y-auto ns px-3 space-y-3.5" style="padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))" id="feed"></main>
</div>

<div id="view-profile" class="view relative overflow-hidden">
<div class="profile-hero" style="background-image:url('https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=1200&q=85')"></div>
<div class="relative z-10 flex items-center justify-between px-4" style="padding-top:max(14px,env(safe-area-inset-top))">
<button onclick="go('home')" class="w-10 h-10 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<button onclick="go('settings')" class="w-10 h-10 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
</div>
<div class="flex-1 relative z-10"></div>
<div class="relative z-10 px-5" style="padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))">
<div class="text-center mb-4"><h2 class="text-[28px] font-bold text-white drop-shadow-lg">Оливия Бейтс</h2><p class="text-[14px] text-white/70 mt-0.5">@oliviia_be</p></div>
<div class="flex items-center justify-center gap-3 mb-5">
<button class="flex-1 max-w-[220px] h-12 rounded-full bg-white text-black font-semibold text-[15px] press" id="btn-follow" onclick="toggleFollow()">Подписаться</button>
<button onclick="go('messages')" class="w-12 h-12 rounded-full bg-white/15 border border-white/20 flex items-center justify-center press"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
</div>
<div class="flex items-center justify-center gap-10 mb-4">
<div class="text-center"><p class="text-[20px] font-bold">252</p><p class="text-[12px] text-white/55">Подписки</p></div>
<div class="text-center"><p class="text-[20px] font-bold">24K</p><p class="text-[12px] text-white/55">Подписчики</p></div>
<div class="text-center"><p class="text-[20px] font-bold">732</p><p class="text-[12px] text-white/55">Работы</p></div>
</div>
<div class="bg-white/10 backdrop-blur-md rounded-2xl px-4 py-3 mb-4 border border-white/10"><p class="text-[13px] text-white/80 text-center">Дизайнеры, которые создают сильный digital-опыт и брендинг.</p></div>
<div class="flex gap-2 overflow-x-auto ns">
<div class="w-[110px] h-[78px] rounded-xl overflow-hidden shrink-0"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover"></div>
<div class="w-[110px] h-[78px] rounded-xl overflow-hidden shrink-0"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover"></div>
<div class="w-[110px] h-[78px] rounded-xl overflow-hidden shrink-0"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover"></div>
</div>
</div>
</div>

<div id="view-notifications" class="view">
<header class="px-5 pb-3 flex items-center gap-3" style="padding-top:max(14px,env(safe-area-inset-top))">
<button onclick="go('home')" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[20px] font-semibold flex-1">Уведомления</h2>
<button class="text-[13px] text-white/50 press" onclick="markAllRead()">Прочитать все</button>
</header>
<div class="flex gap-2 px-5 pb-3 overflow-x-auto ns" id="notif-tabs">
<button data-tab="all" class="notif-tab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white text-black">Все</button>
<button data-tab="social" class="notif-tab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Социальные</button>
<button data-tab="orders" class="notif-tab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Заказы</button>
<button data-tab="system" class="notif-tab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Система</button>
</div>
<div class="flex-1 overflow-y-auto ns px-4 space-y-2" style="padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))" id="notif-list"></div>
</div>

<div id="view-messages" class="view">
<header class="px-5 pb-3 flex items-center justify-between" style="padding-top:max(14px,env(safe-area-inset-top))">
<h2 class="text-[22px] font-semibold">Сообщения</h2>
</header>
<div class="px-4 pb-2"><div class="flex items-center gap-2 bg-[#1a1a1a] rounded-2xl px-3.5 py-2.5">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="msg-search" type="search" placeholder="Поиск чатов" class="bg-transparent outline-none text-[14px] flex-1 placeholder:text-white/35" oninput="renderChats()">
</div></div>
<div class="flex-1 overflow-y-auto ns" style="padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))" id="chats-list"></div>
</div>

<div id="view-chat" class="view">
<header class="px-3 pb-2 flex items-center gap-2 border-b border-white/5" style="padding-top:max(12px,env(safe-area-inset-top))">
<button onclick="go('messages')" class="w-9 h-9 rounded-full flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<img id="chat-avatar" class="w-9 h-9 rounded-full object-cover" alt="">
<div class="flex-1 min-w-0"><p id="chat-name" class="text-[15px] font-semibold truncate"></p><p class="text-[12px] text-white/45">в сети</p></div>
</header>
<div class="flex-1 overflow-y-auto ns px-3 py-3 space-y-2" id="chat-messages"></div>
<div class="px-3 pt-2 flex items-center gap-2" style="padding-bottom:max(12px,env(safe-area-inset-bottom))">
<input id="chat-input" type="text" placeholder="Сообщение…" class="flex-1 bg-[#1a1a1a] rounded-full px-4 py-2.5 text-[14px] outline-none placeholder:text-white/35" onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()" class="w-10 h-10 rounded-full bg-gradient-to-br from-[#a855f7] to-[#ec4899] flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>

<div id="view-explore" class="view">
<header class="px-4 pb-2" style="padding-top:max(14px,env(safe-area-inset-top))">
<div class="flex items-center gap-2 bg-[#1a1a1a] rounded-2xl px-3.5 py-2.5">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="explore-q" type="search" placeholder="Люди, каналы, магазины…" class="bg-transparent outline-none text-[14px] flex-1 placeholder:text-white/35" oninput="renderExplore()">
</div></header>
<div class="flex gap-2 px-4 pb-3 overflow-x-auto ns" id="explore-tabs">
<button data-etab="all" class="etab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white text-black">Все</button>
<button data-etab="people" class="etab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Люди</button>
<button data-etab="channels" class="etab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Каналы</button>
<button data-etab="shops" class="etab px-3.5 py-1.5 rounded-full text-[13px] font-medium bg-white/10 text-white/70">Магазины</button>
</div>
<div class="flex-1 overflow-y-auto ns px-4 space-y-3" style="padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))" id="explore-results"></div>
</div>

<div id="view-settings" class="view">
<header class="px-5 pb-3 flex items-center gap-3" style="padding-top:max(14px,env(safe-area-inset-top))">
<button onclick="go('profile')" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[20px] font-semibold">Настройки</h2>
</header>
<div class="flex-1 overflow-y-auto ns px-4 space-y-6" style="padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))" id="settings-body"></div>
</div>

<div id="backdrop" class="backdrop" onclick="closeSheet()"></div>
<div id="create-sheet" class="sheet"><div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-4"></div><p class="text-[16px] font-semibold mb-3">Создать</p><div id="create-options"></div></div>
<div id="comments-sheet" class="sheet" style="max-height:70vh;display:flex;flex-direction:column"><div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-3"></div><p class="text-[16px] font-semibold mb-3">Комментарии</p><div class="flex-1 overflow-y-auto ns space-y-3 mb-3" id="comments-list"></div><div class="flex gap-2"><input id="comment-input" type="text" placeholder="Комментарий…" class="flex-1 bg-[#1a1a1a] rounded-full px-4 py-2.5 text-[14px] outline-none" onkeydown="if(event.key==='Enter')addComment()"><button onclick="addComment()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center press">→</button></div></div>

<nav class="absolute bottom-0 left-0 right-0 px-4 z-20" style="padding-bottom:max(4px, calc(env(safe-area-inset-bottom)*0.55))">
<div class="flex items-center justify-between bg-[#1c1c1e]/95 backdrop-blur-xl rounded-full px-1 py-0.5 border border-white/8 max-w-[300px] mx-auto">
<button data-route="home" class="nav-btn nav-item active w-12 h-12 rounded-full flex items-center justify-center press" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
<button data-route="explore" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center text-white/50 press" onclick="go('explore')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></button>
<button class="w-12 h-12 rounded-full flex items-center justify-center text-white/50 press" onclick="openCreate()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
<button data-route="messages" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center text-white/50 press relative" onclick="go('messages')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span id="msg-badge" class="hidden absolute top-1 right-1 w-4 h-4 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center">2</span></button>
<button data-route="profile" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center text-white/50 press" onclick="go('profile')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
</div></nav>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-white text-black text-[13px] font-medium opacity-0 pointer-events-none transition-opacity" style="bottom:calc(90px + env(safe-area-inset-bottom))"></div>
</div>
<script>
const DB={following:false,stories:[{id:'add',type:'add',name:'Добавить'},{id:'s1',name:'Альфредо',avatar:'https://i.pravatar.cc/140?u=alfredo'},{id:'s2',name:'Корсгард',avatar:null},{id:'s3',name:'Эшлинн',avatar:'https://i.pravatar.cc/140?u=ashlynn'},{id:'s4',name:'Адамс',avatar:'https://i.pravatar.cc/140?u=adams'}],posts:[{id:'p1',author:'Марли Корсгард',avatar:'https://i.pravatar.cc/64?u=marley',image:'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=900&q=80',likes:12100,comments:24,liked:false,saved:false,text:'Каждое большое достижение начинается с маленького шага. 🔥',tags:'#Продолжай',commentList:[{user:'София',text:'Очень вовремя 💫'}]},{id:'p2',author:'София Беннетт',avatar:'https://i.pravatar.cc/64?u=sofia',image:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80',likes:18,comments:1,liked:false,saved:false,text:'Просто хороший день. Солнце, ветер и ничего лишнего.',tags:'',commentList:[]}],notifications:[{id:1,cat:'social',read:false,title:'Марли',body:'оценила ваш пост',time:'2м',avatar:'https://i.pravatar.cc/64?u=marley'},{id:2,cat:'social',read:false,title:'Альфредо',body:'подписался на вас',time:'15м',avatar:'https://i.pravatar.cc/64?u=alfredo'},{id:3,cat:'orders',read:false,title:'Заказ #1042',body:'передан в доставку',time:'3ч',avatar:null},{id:4,cat:'system',read:true,title:'Безопасность',body:'Вход с нового устройства',time:'1д',avatar:null}],chats:[{id:'c1',name:'Марли Корсгард',avatar:'https://i.pravatar.cc/64?u=marley',last:'Увидимся на съёмке?',time:'12:40',unread:1,messages:[{me:false,text:'Привет! Как дела?'},{me:true,text:'Почти готово'},{me:false,text:'Увидимся на съёмке?'}]},{id:'c2',name:'Альфредо',avatar:'https://i.pravatar.cc/64?u=alfredo',last:'Ок, скину файлы',time:'Вчера',unread:1,messages:[{me:true,text:'Нужны исходники'},{me:false,text:'Ок, скину файлы'}]}],explore:{people:[{name:'Оливия Бейтс',handle:'@oliviia_be',avatar:'https://i.pravatar.cc/64?u=olivia'},{name:'Марли Корсгард',handle:'@marley',avatar:'https://i.pravatar.cc/64?u=marley'}],channels:[{name:'Design Daily',members:'12.4K',desc:'UI каждый день'},{name:'Atlantis Lab',members:'3.1K',desc:'Новости продукта'}],shops:[{name:'Nord Studio',products:48,desc:'Объекты и принты'}]},activeChat:null,activePostComments:null,notifTab:'all',exploreTab:'all'};
const VIEWS=['home','profile','notifications','messages','chat','explore','settings'];
function go(route,params){closeSheet();VIEWS.forEach(v=>{const el=document.getElementById('view-'+v);if(el)el.classList.toggle('active',v===route)});document.querySelectorAll('.nav-btn').forEach(b=>{const r=b.getAttribute('data-route');const on=r===route||(route==='chat'&&r==='messages');b.classList.toggle('active',on);b.classList.toggle('text-white/50',!on)});if(route==='chat'&&params?.chatId)openChat(params.chatId);if(route==='notifications')renderNotifs();if(route==='messages')renderChats();if(route==='explore')renderExplore();if(route==='settings')renderSettings();location.hash=route}
function renderStories(){document.getElementById('stories-row').innerHTML=DB.stories.map(s=>{if(s.type==='add')return `<button class="flex flex-col items-center gap-1.5 shrink-0 press" onclick="openCreate()"><div class="w-[68px] h-[68px] rounded-full bg-[#1a1a1a] border border-white/10 flex items-center justify-center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white/60"><path d="M12 5v14M5 12h14"/></svg></div><span class="text-[11px] text-white/50">${s.name}</span></button>`;const inner=s.avatar?`<img src="${s.avatar}" class="w-full h-full rounded-full object-cover border-[2.5px] border-black">`:`<div class="w-full h-full rounded-full bg-[#2a2a2a] border-[2.5px] border-black flex items-center justify-center text-white/30">?</div>`;return `<button class="flex flex-col items-center gap-1.5 shrink-0 press" onclick="go('profile')"><div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">${inner}</div><span class="text-[11px] text-white/80">${s.name}</span></button>`}).join('')}
function fmtLikes(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+' тыс.':String(n)}
function renderFeed(){document.getElementById('feed').innerHTML=DB.posts.map(p=>`<article class="post-card" data-id="${p.id}"><div class="p-2"><div class="relative rounded-[28px] overflow-hidden bg-[#e8e8ed]"><img src="${p.image}" class="w-full h-[260px] object-cover block" loading="lazy"><div class="absolute top-3 left-3 flex items-center gap-2"><img src="${p.avatar}" class="w-7 h-7 rounded-full object-cover border border-white/70"><span class="text-[13px] font-semibold text-white drop-shadow">${p.author}</span></div><div class="absolute bottom-3 left-3 flex items-center gap-1.5"><button class="flex items-center gap-1 bg-black/40 backdrop-blur-md rounded-full px-2.5 py-1 press" onclick="toggleLike('${p.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="${p.liked?'#ef4444':'none'}" stroke="${p.liked?'#ef4444':'white'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="text-[11.5px] font-medium text-white">${fmtLikes(p.likes)}</span></button><button class="flex items-center gap-1 bg-black/40 backdrop-blur-md rounded-full px-2.5 py-1 press" onclick="openComments('${p.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text-[11.5px] font-medium text-white">${p.comments}</span></button></div><button class="absolute bottom-3 right-3 w-8 h-8 rounded-full bg-black/40 flex items-center justify-center press" onclick="toggleSave('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="${p.saved?'white':'none'}" stroke="white" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button></div></div><div class="px-3.5 pt-1 pb-3.5"><div class="flex items-center gap-2 mb-1"><img src="${p.avatar}" class="w-5 h-5 rounded-full"><span class="text-[13px] font-semibold text-black">${p.author}</span></div><p class="text-[13px] text-black/70">${p.text}</p>${p.tags?`<p class="text-[12.5px] text-black/45 mt-1">${p.tags}</p>`:''}</div></article>`).join('')}
function toggleLike(id){const p=DB.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;renderFeed()}
function toggleSave(id){const p=DB.posts.find(x=>x.id===id);if(!p)return;p.saved=!p.saved;toast(p.saved?'Сохранено':'Убрано');renderFeed()}
function openComments(postId){DB.activePostComments=postId;const p=DB.posts.find(x=>x.id===postId);document.getElementById('comments-list').innerHTML=(p.commentList||[]).map(c=>`<div class="flex gap-2.5"><div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-[12px]">${c.user[0]}</div><div><p class="text-[13px] font-medium">${c.user}</p><p class="text-[13px] text-white/70">${c.text}</p></div></div>`).join('')||'<p class="text-center text-white/40 py-6 text-[13px]">Нет комментариев</p>';document.getElementById('backdrop').classList.add('open');document.getElementById('comments-sheet').classList.add('open')}
function addComment(){const input=document.getElementById('comment-input');const text=input.value.trim();if(!text||!DB.activePostComments)return;const p=DB.posts.find(x=>x.id===DB.activePostComments);p.commentList.push({user:'Вы',text});p.comments++;input.value='';openComments(p.id);renderFeed()}
function renderNotifs(){const list=DB.notifications.filter(n=>DB.notifTab==='all'||n.cat===DB.notifTab);document.getElementById('notif-list').innerHTML=list.map(n=>`<div class="flex gap-3 p-3 rounded-2xl ${n.read?'bg-white/5':'bg-white/10'}"><div class="w-11 h-11 rounded-full overflow-hidden bg-white/10 shrink-0 flex items-center justify-center">${n.avatar?`<img src="${n.avatar}" class="w-full h-full object-cover">`:'🔔'}</div><div class="flex-1"><p class="text-[14px]"><span class="font-semibold">${n.title}</span> <span class="text-white/70">${n.body}</span></p><p class="text-[12px] text-white/40">${n.time}</p></div></div>`).join('')||'<p class="text-center text-white/40 py-10">Нет уведомлений</p>';document.getElementById('notif-dot').style.display=DB.notifications.some(n=>!n.read)?'':'none'}
function markAllRead(){DB.notifications.forEach(n=>n.read=true);renderNotifs();toast('Все прочитаны')}
document.getElementById('notif-tabs').addEventListener('click',e=>{const btn=e.target.closest('[data-tab]');if(!btn)return;DB.notifTab=btn.dataset.tab;document.querySelectorAll('.notif-tab').forEach(b=>{const on=b.dataset.tab===DB.notifTab;b.className='notif-tab px-3.5 py-1.5 rounded-full text-[13px] font-medium '+(on?'bg-white text-black':'bg-white/10 text-white/70')});renderNotifs()});
function renderChats(){const q=(document.getElementById('msg-search')?.value||'').toLowerCase();const list=DB.chats.filter(c=>!q||c.name.toLowerCase().includes(q));document.getElementById('chats-list').innerHTML=list.map(c=>`<button class="w-full flex items-center gap-3 px-4 py-3 press text-left" onclick="go('chat',{chatId:'${c.id}'})"><img src="${c.avatar}" class="w-12 h-12 rounded-full object-cover"><div class="flex-1 min-w-0"><div class="flex justify-between"><p class="text-[15px] font-semibold truncate">${c.name}</p><span class="text-[11px] text-white/40">${c.time}</span></div><p class="text-[13px] text-white/50 truncate">${c.last}</p></div>${c.unread?`<span class="w-5 h-5 rounded-full bg-[#a855f7] text-[11px] font-bold flex items-center justify-center">${c.unread}</span>`:''}</button>`).join('');const unread=DB.chats.reduce((s,c)=>s+c.unread,0);const badge=document.getElementById('msg-badge');if(unread){badge.textContent=unread;badge.classList.remove('hidden')}else badge.classList.add('hidden')}
function openChat(id){const c=DB.chats.find(x=>x.id===id);if(!c)return;DB.activeChat=id;c.unread=0;document.getElementById('chat-avatar').src=c.avatar;document.getElementById('chat-name').textContent=c.name;const box=document.getElementById('chat-messages');box.innerHTML=c.messages.map(m=>`<div class="flex ${m.me?'justify-end':''}"><div class="max-w-[78%] px-3.5 py-2 text-[14px] ${m.me?'chat-bubble-me':'chat-bubble-them'}">${m.text}</div></div>`).join('');box.scrollTop=box.scrollHeight}
function sendMsg(){const input=document.getElementById('chat-input');const text=input.value.trim();if(!text||!DB.activeChat)return;const c=DB.chats.find(x=>x.id===DB.activeChat);c.messages.push({me:true,text});c.last=text;c.time='сейчас';input.value='';openChat(c.id)}
function renderExplore(){const q=(document.getElementById('explore-q')?.value||'').toLowerCase();const tab=DB.exploreTab;let html='';const people=DB.explore.people.filter(p=>!q||p.name.toLowerCase().includes(q));const channels=DB.explore.channels.filter(c=>!q||c.name.toLowerCase().includes(q));const shops=DB.explore.shops.filter(s=>!q||s.name.toLowerCase().includes(q));if(tab==='all'||tab==='people'){if(people.length)html+=`<p class="text-[12px] text-white/40 mb-2">Люди</p>`+people.map(p=>`<button class="w-full flex items-center gap-3 p-2.5 rounded-2xl bg-white/5 press mb-1.5" onclick="go('profile')"><img src="${p.avatar}" class="w-11 h-11 rounded-full"><div class="text-left"><p class="text-[14px] font-semibold">${p.name}</p><p class="text-[12px] text-white/45">${p.handle}</p></div></button>`).join('')}
if(tab==='all'||tab==='channels'){if(channels.length)html+=`<p class="text-[12px] text-white/40 mb-2 mt-3">Каналы</p>`+channels.map(c=>`<div class="p-3.5 rounded-2xl bg-white/5 mb-1.5"><p class="text-[14px] font-semibold">${c.name}</p><p class="text-[12px] text-white/45">${c.desc} · ${c.members}</p></div>`).join('')}
if(tab==='all'||tab==='shops'){if(shops.length)html+=`<p class="text-[12px] text-white/40 mb-2 mt-3">Магазины</p>`+shops.map(s=>`<div class="p-3.5 rounded-2xl bg-white/5 mb-1.5"><p class="text-[14px] font-semibold">${s.name}</p><p class="text-[12px] text-white/45">${s.desc} · ${s.products} товаров</p></div>`).join('')}
document.getElementById('explore-results').innerHTML=html||'<p class="text-center text-white/40 py-10">Ничего не найдено</p>'}
document.getElementById('explore-tabs').addEventListener('click',e=>{const btn=e.target.closest('[data-etab]');if(!btn)return;DB.exploreTab=btn.dataset.etab;document.querySelectorAll('.etab').forEach(b=>{const on=b.dataset.etab===DB.exploreTab;b.className='etab px-3.5 py-1.5 rounded-full text-[13px] font-medium '+(on?'bg-white text-black':'bg-white/10 text-white/70')});renderExplore()});
function renderSettings(){const groups=[{title:'Аккаунт',items:['Профиль и имя','Конфиденциальность','Блокировки']},{title:'Безопасность',items:['Двухфакторная аутентификация','Активные сессии']},{title:'Уведомления',items:['Push','Категории событий']},{title:'Данные',items:['Экспорт данных','Удаление аккаунта']}];document.getElementById('settings-body').innerHTML=groups.map(g=>`<div><p class="text-[12px] text-white/40 mb-2">${g.title}</p><div class="rounded-2xl bg-white/5 overflow-hidden divide-y divide-white/5">${g.items.map(i=>`<button class="w-full text-left px-4 py-3.5 text-[14px] press" onclick="toast('${i} — UI готов')">${i}</button>`).join('')}</div></div>`).join('')}
function openCreate(){document.getElementById('create-options').innerHTML=[['Пост','В ленту'],['История','Атлас 24ч'],['Канал','Для аудитории'],['Магазин','Каталог и заказы'],['Сообщество','Группа']].map(([t,d])=>`<button class="w-full flex items-center gap-3 px-3 py-3 rounded-2xl press text-left" onclick="closeSheet();toast('${t}: следующий этап')"><div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">✦</div><div><p class="text-[14px] font-medium">${t}</p><p class="text-[12px] text-white/45">${d}</p></div></button>`).join('');document.getElementById('backdrop').classList.add('open');document.getElementById('create-sheet').classList.add('open')}
function closeSheet(){document.getElementById('backdrop').classList.remove('open');document.getElementById('create-sheet').classList.remove('open');document.getElementById('comments-sheet').classList.remove('open')}
function toggleFollow(){DB.following=!DB.following;const btn=document.getElementById('btn-follow');btn.textContent=DB.following?'Вы подписаны':'Подписаться';btn.classList.toggle('bg-white',!DB.following);btn.classList.toggle('text-black',!DB.following);btn.classList.toggle('bg-white/15',DB.following);btn.classList.toggle('text-white',DB.following);toast(DB.following?'Подписка оформлена':'Отписались')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.style.opacity='0',1800)}
renderStories();renderFeed();renderNotifs();renderChats();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
