<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Atlantis"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<title>Atlantis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;height:100dvh;height:100svh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:#000;overflow:hidden}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .15s}.press:active{transform:scale(.96);opacity:.88}
.story-ring{background:conic-gradient(from 210deg,#a855f7,#ec4899,#f97316,#a855f7);padding:2.5px;border-radius:999px}
.post-card{border-radius:32px;overflow:hidden;background:#f3f3f5;color:#0a0a0a;box-shadow:0 8px 40px rgba(0,0,0,.35);animation:cardIn .4s cubic-bezier(.2,.8,.2,1) both}
.post-card:nth-child(2){animation-delay:.06s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.nav-item{transition:all .2s cubic-bezier(.2,.8,.2,1);color:rgba(255,255,255,.4)}
.nav-item.active{background:#fff;color:#000;box-shadow:0 2px 12px rgba(255,255,255,.25)}
#bottom-nav{transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
#bottom-nav.hide{opacity:0;pointer-events:none;transform:translateY(24px)}
.view{display:none;flex-direction:column;height:100%;min-height:0;animation:viewIn .28s cubic-bezier(.2,.8,.2,1)}
.view.active{display:flex}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.profile-hero{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.profile-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.88) 78%,#000 100%)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,#1a1a1c,#121214);border-radius:28px 28px 0 0;padding:10px 16px 0;transform:translateY(108%);transition:transform .35s cubic-bezier(.2,.85,.2,1);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 -12px 48px rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.06)}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:4px auto 14px;flex-shrink:0}
.sheet-body{flex:1;overflow-y:auto;min-height:0}
.sheet-foot{flex-shrink:0;padding:12px 0;padding-bottom:max(12px,var(--safe-b));background:linear-gradient(180deg,transparent,#121214 20%)}
.backdrop{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .28s}
.backdrop.open{opacity:1;pointer-events:auto}
.chat-bubble-me{background:linear-gradient(135deg,#a855f7,#c026d3);color:#fff;border-radius:20px 20px 6px 20px;box-shadow:0 4px 16px rgba(168,85,247,.25)}
.chat-bubble-them{background:#1c1c1e;color:#fff;border-radius:20px 20px 20px 6px;border:1px solid rgba(255,255,255,.05)}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);z-index:70;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.92);color:#000;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 32px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.grad-text{background:linear-gradient(135deg,#c084fc,#f472b6,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.liked-pop{animation:heartPop .35s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body>
<div id="app">

<div id="view-home" class="view active">
<header class="px-5 pb-2 flex items-center justify-between shrink-0" style="padding-top:max(14px,var(--safe-t))">
<h1 class="text-[30px] font-extrabold tracking-tight leading-none"><span class="grad-text">Atlantis</span></h1>
<button onclick="go('notifications')" class="w-11 h-11 rounded-full glass flex items-center justify-center press relative">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" class="text-white/90"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
<span id="notif-dot" class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full ring-2 ring-black"></span>
</button>
</header>
<section class="px-5 pb-3 shrink-0">
<p class="text-[12px] text-white/40 mb-3 font-medium tracking-wide uppercase">Ваши Атласы</p>
<div class="flex gap-3.5 overflow-x-auto ns -mx-1 px-1" id="stories-row"></div>
</section>
<main class="flex-1 overflow-y-auto ns px-3.5 space-y-4" style="padding-bottom:calc(88px + var(--safe-b))" id="feed"></main>
</div>

<div id="view-profile" class="view relative overflow-hidden">
<div class="profile-hero" style="background-image:url('https://picsum.photos/seed/oliviahero/1200/1800')"></div>
<div class="relative z-10 flex items-center justify-between px-4" style="padding-top:max(14px,var(--safe-t))">
<button onclick="go('home')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<button onclick="go('settings')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
</div>
<div class="flex-1 relative z-10"></div>
<div class="relative z-10 px-5" style="padding-bottom:calc(96px + var(--safe-b))">
<div class="text-center mb-5"><h2 class="text-[32px] font-bold text-white tracking-tight drop-shadow-lg">Оливия Бейтс</h2><p class="text-[14px] text-white/55 mt-1 font-medium">@oliviia_be</p></div>
<div class="flex items-center justify-center gap-3 mb-6">
<button class="flex-1 max-w-[230px] h-[50px] rounded-full bg-white text-black font-semibold text-[15px] press shadow-lg shadow-white/10" id="btn-follow" onclick="toggleFollow()">Подписаться</button>
<button onclick="go('messages')" class="w-[50px] h-[50px] rounded-full glass flex items-center justify-center press"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
</div>
<div class="flex items-center justify-center gap-12 mb-5">
<div class="text-center"><p class="text-[22px] font-bold tracking-tight">252</p><p class="text-[11px] text-white/45 mt-0.5 font-medium">Подписки</p></div>
<div class="text-center"><p class="text-[22px] font-bold tracking-tight">24K</p><p class="text-[11px] text-white/45 mt-0.5 font-medium">Подписчики</p></div>
<div class="text-center"><p class="text-[22px] font-bold tracking-tight">732</p><p class="text-[11px] text-white/45 mt-0.5 font-medium">Работы</p></div>
</div>
<div class="glass rounded-2xl px-4 py-3.5 mb-5"><p class="text-[13px] text-white/75 leading-relaxed text-center">Дизайнеры, которые создают сильный digital-опыт и брендинг.</p></div>
<div class="flex gap-2.5 overflow-x-auto ns">
<div class="w-[120px] h-[84px] rounded-2xl overflow-hidden shrink-0 ring-1 ring-white/10"><img src="https://picsum.photos/seed/g1/360/240" class="w-full h-full object-cover"></div>
<div class="w-[120px] h-[84px] rounded-2xl overflow-hidden shrink-0 ring-1 ring-white/10"><img src="https://picsum.photos/seed/g2/360/240" class="w-full h-full object-cover"></div>
<div class="w-[120px] h-[84px] rounded-2xl overflow-hidden shrink-0 ring-1 ring-white/10"><img src="https://picsum.photos/seed/g3/360/240" class="w-full h-full object-cover"></div>
</div>
</div>
</div>

<div id="view-notifications" class="view">
<header class="px-5 pb-3 flex items-center gap-3" style="padding-top:max(14px,var(--safe-t))">
<button onclick="go('home')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[22px] font-bold flex-1 tracking-tight">Уведомления</h2>
<button class="text-[13px] text-white/50 font-medium press px-2" onclick="markAllRead()">Прочитать</button>
</header>
<div class="flex gap-2 px-5 pb-3 overflow-x-auto ns" id="notif-tabs">
<button data-tab="all" class="notif-tab px-4 py-1.5 rounded-full text-[13px] font-semibold bg-white text-black">Все</button>
<button data-tab="social" class="notif-tab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Социальные</button>
<button data-tab="orders" class="notif-tab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Заказы</button>
<button data-tab="system" class="notif-tab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Система</button>
</div>
<div class="flex-1 overflow-y-auto ns px-4 space-y-2" style="padding-bottom:calc(88px + var(--safe-b))" id="notif-list"></div>
</div>

<div id="view-messages" class="view">
<header class="px-5 pb-3" style="padding-top:max(14px,var(--safe-t))"><h2 class="text-[26px] font-bold tracking-tight">Сообщения</h2></header>
<div class="px-4 pb-3"><div class="flex items-center gap-2.5 glass rounded-2xl px-4 py-3">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="msg-search" type="search" placeholder="Поиск" class="bg-transparent outline-none text-[15px] flex-1 placeholder:text-white/30" oninput="renderChats()">
</div></div>
<div class="flex-1 overflow-y-auto ns" style="padding-bottom:calc(88px + var(--safe-b))" id="chats-list"></div>
</div>

<div id="view-chat" class="view">
<header class="px-3 pb-2.5 flex items-center gap-2.5 border-b border-white/5" style="padding-top:max(12px,var(--safe-t))">
<button onclick="go('messages')" class="w-10 h-10 rounded-full flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<img id="chat-avatar" class="w-10 h-10 rounded-full object-cover ring-2 ring-white/10" alt="">
<div class="flex-1 min-w-0"><p id="chat-name" class="text-[15px] font-semibold truncate"></p><p class="text-[12px] text-emerald-400/90 font-medium">в сети</p></div>
</header>
<div class="flex-1 overflow-y-auto ns px-3.5 py-4 space-y-2.5" id="chat-messages"></div>
<div class="px-3 pt-2 flex items-center gap-2" style="padding-bottom:max(12px,var(--safe-b))">
<input id="chat-input" type="text" placeholder="Сообщение…" class="flex-1 bg-[#1a1a1c] rounded-full px-4 py-3 text-[15px] outline-none placeholder:text-white/30 border border-white/5" onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()" class="w-11 h-11 rounded-full flex items-center justify-center press shrink-0" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>

<div id="view-explore" class="view">
<header class="px-4 pb-2" style="padding-top:max(14px,var(--safe-t))">
<div class="flex items-center gap-2.5 glass rounded-2xl px-4 py-3">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="explore-q" type="search" placeholder="Люди, каналы, магазины…" class="bg-transparent outline-none text-[15px] flex-1 placeholder:text-white/30" oninput="renderExplore()">
</div></header>
<div class="flex gap-2 px-4 pb-3 overflow-x-auto ns" id="explore-tabs">
<button data-etab="all" class="etab px-4 py-1.5 rounded-full text-[13px] font-semibold bg-white text-black">Все</button>
<button data-etab="people" class="etab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Люди</button>
<button data-etab="channels" class="etab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Каналы</button>
<button data-etab="shops" class="etab px-4 py-1.5 rounded-full text-[13px] font-medium glass text-white/70">Магазины</button>
</div>
<div class="flex-1 overflow-y-auto ns px-4 space-y-3" style="padding-bottom:calc(88px + var(--safe-b))" id="explore-results"></div>
</div>

<div id="view-settings" class="view">
<header class="px-5 pb-3 flex items-center gap-3" style="padding-top:max(14px,var(--safe-t))">
<button onclick="go('profile')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[22px] font-bold tracking-tight">Настройки</h2>
</header>
<div class="flex-1 overflow-y-auto ns px-4 space-y-6" style="padding-bottom:calc(88px + var(--safe-b))" id="settings-body"></div>
</div>

<div id="backdrop" class="backdrop" onclick="closeSheet()"></div>
<div id="create-sheet" class="sheet"><div class="sheet-handle"></div><p class="text-[17px] font-semibold mb-3 shrink-0">Создать</p><div class="sheet-body space-y-1 pb-2" id="create-options"></div><div class="sheet-foot"></div></div>
<div id="comments-sheet" class="sheet"><div class="sheet-handle"></div><p class="text-[17px] font-semibold mb-3 shrink-0">Комментарии</p><div class="sheet-body space-y-3.5 pb-2" id="comments-list"></div><div class="sheet-foot"><div class="flex gap-2.5 items-center"><input id="comment-input" type="text" placeholder="Написать комментарий…" class="flex-1 bg-[#1a1a1c] rounded-full px-4 py-3 text-[14px] outline-none placeholder:text-white/30 border border-white/5" onkeydown="if(event.key==='Enter')addComment()"><button onclick="addComment()" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center press shrink-0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button></div></div></div>

<nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 px-4 z-30" style="padding-bottom:max(6px, calc(var(--safe-b) * 0.6))">
<div class="flex items-center justify-between rounded-full px-1.5 py-1 max-w-[310px] mx-auto" style="background:rgba(22,22,24,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);box-shadow:0 8px 40px rgba(0,0,0,.55)">
<button data-route="home" class="nav-btn nav-item active w-12 h-12 rounded-full flex items-center justify-center press" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
<button data-route="explore" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center press" onclick="go('explore')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></button>
<button class="w-12 h-12 rounded-full flex items-center justify-center press text-white/50" onclick="openCreate()"><div class="w-9 h-9 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></div></button>
<button data-route="messages" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center press relative" onclick="go('messages')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span id="msg-badge" class="hidden absolute top-1.5 right-1.5 min-w-[16px] h-4 px-1 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center">2</span></button>
<button data-route="profile" class="nav-btn nav-item w-12 h-12 rounded-full flex items-center justify-center press" onclick="go('profile')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
</div></nav>
<div id="toast" style="bottom:calc(100px + var(--safe-b))"></div>
</div>
<script>
const DB={following:false,stories:[{id:'add',type:'add',name:'Добавить'},{id:'s1',name:'Альфредо',avatar:'https://i.pravatar.cc/140?u=alfredo'},{id:'s2',name:'Корсгард',avatar:null},{id:'s3',name:'Эшлинн',avatar:'https://i.pravatar.cc/140?u=ashlynn'},{id:'s4',name:'Адамс',avatar:'https://i.pravatar.cc/140?u=adams'},{id:'s5',name:'Миа',avatar:'https://i.pravatar.cc/140?u=mia'}],posts:[{id:'p1',author:'Марли Корсгард',avatar:'https://i.pravatar.cc/64?u=marley',image:'https://picsum.photos/seed/atl1/900/700',likes:12100,comments:24,liked:false,saved:false,text:'Каждое большое достижение начинается с маленького шага. Продолжай — прогресс накапливается. 🔥',tags:'#Продолжай #Прогресс',commentList:[{user:'София',text:'Очень вовремя 💫'},{user:'Макс',text:'В точку'}]},{id:'p2',author:'София Беннетт',avatar:'https://i.pravatar.cc/64?u=sofia',image:'https://picsum.photos/seed/atl2/900/700',likes:18,comments:1,liked:false,saved:false,text:'Просто хороший день. Солнце, ветер и ничего лишнего.',tags:'',commentList:[]}],notifications:[{id:1,cat:'social',read:false,title:'Марли',body:'оценила ваш пост',time:'2м',avatar:'https://i.pravatar.cc/64?u=marley'},{id:2,cat:'social',read:false,title:'Альфредо',body:'подписался на вас',time:'15м',avatar:'https://i.pravatar.cc/64?u=alfredo'},{id:3,cat:'orders',read:false,title:'Заказ #1042',body:'передан в доставку',time:'3ч',avatar:null},{id:4,cat:'system',read:true,title:'Безопасность',body:'Вход с нового устройства',time:'1д',avatar:null}],chats:[{id:'c1',name:'Марли Корсгард',avatar:'https://i.pravatar.cc/64?u=marley',last:'Увидимся на съёмке?',time:'12:40',unread:1,messages:[{me:false,text:'Привет! Как дела?'},{me:true,text:'Почти готово'},{me:false,text:'Увидимся на съёмке?'}]},{id:'c2',name:'Альфредо',avatar:'https://i.pravatar.cc/64?u=alfredo',last:'Ок, скину файлы',time:'Вчера',unread:1,messages:[{me:true,text:'Нужны исходники'},{me:false,text:'Ок, скину файлы'}]}],explore:{people:[{name:'Оливия Бейтс',handle:'@oliviia_be',avatar:'https://i.pravatar.cc/64?u=olivia'},{name:'Марли Корсгард',handle:'@marley',avatar:'https://i.pravatar.cc/64?u=marley'}],channels:[{name:'Design Daily',members:'12.4K',desc:'UI каждый день'},{name:'Atlantis Lab',members:'3.1K',desc:'Новости продукта'}],shops:[{name:'Nord Studio',products:48,desc:'Объекты и принты'}]},activeChat:null,activePostComments:null,notifTab:'all',exploreTab:'all'};
const VIEWS=['home','profile','notifications','messages','chat','explore','settings'];
function go(route,params){closeSheet();VIEWS.forEach(v=>{const el=document.getElementById('view-'+v);if(el)el.classList.toggle('active',v===route)});document.querySelectorAll('.nav-btn').forEach(b=>{const r=b.getAttribute('data-route');const on=r===route||(route==='chat'&&r==='messages');b.classList.toggle('active',on)});if(route==='chat'&&params?.chatId)openChat(params.chatId);if(route==='notifications')renderNotifs();if(route==='messages')renderChats();if(route==='explore')renderExplore();if(route==='settings')renderSettings();location.hash=route}
function setNavVisible(v){document.getElementById('bottom-nav').classList.toggle('hide',!v)}
function renderStories(){document.getElementById('stories-row').innerHTML=DB.stories.map(s=>{if(s.type==='add')return `<button class="flex flex-col items-center gap-1.5 shrink-0 press" onclick="openCreate()"><div class="w-[72px] h-[72px] rounded-full bg-[#161618] border border-white/10 flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></div><span class="text-[11px] text-white/45 font-medium">Добавить</span></button>`;const inner=s.avatar?`<img src="${s.avatar}" class="w-full h-full rounded-full object-cover border-[3px] border-black" alt="">`:`<div class="w-full h-full rounded-full bg-[#1e1e20] border-[3px] border-black flex items-center justify-center text-white/25 text-lg">?</div>`;return `<button class="flex flex-col items-center gap-1.5 shrink-0 press" onclick="go('profile')"><div class="w-[72px] h-[72px] story-ring">${inner}</div><span class="text-[11px] text-white/75 font-medium">${s.name}</span></button>`}).join('')}
function fmtLikes(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+' тыс.':String(n)}
function renderFeed(){document.getElementById('feed').innerHTML=DB.posts.map(p=>`<article class="post-card" data-id="${p.id}"><div class="p-[7px]"><div class="relative rounded-[26px] overflow-hidden bg-[#e4e4e8]"><img src="${p.image}" class="w-full h-[270px] object-cover block" loading="lazy" alt=""><div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-black/20 pointer-events-none"></div><div class="absolute top-3 left-3 flex items-center gap-2"><img src="${p.avatar}" class="w-8 h-8 rounded-full object-cover ring-2 ring-white/40" alt=""><span class="text-[13px] font-semibold text-white drop-shadow-md">${p.author}</span></div><div class="absolute bottom-3 left-3 flex items-center gap-1.5"><button class="flex items-center gap-1.5 glass rounded-full px-3 py-1.5 press" onclick="toggleLike('${p.id}',this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="${p.liked?'#ef4444':'none'}" stroke="${p.liked?'#ef4444':'white'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="text-[12px] font-semibold text-white">${fmtLikes(p.likes)}</span></button><button class="flex items-center gap-1.5 glass rounded-full px-3 py-1.5 press" onclick="openComments('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="text-[12px] font-semibold text-white">${p.comments}</span></button></div><button class="absolute bottom-3 right-3 w-9 h-9 rounded-full glass flex items-center justify-center press" onclick="toggleSave('${p.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="${p.saved?'white':'none'}" stroke="white" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button></div></div><div class="px-4 pt-1.5 pb-4"><div class="flex items-center gap-2 mb-1.5"><img src="${p.avatar}" class="w-5 h-5 rounded-full object-cover" alt=""><span class="text-[13px] font-semibold text-black">${p.author}</span></div><p class="text-[13.5px] leading-snug text-black/70">${p.text}</p>${p.tags?`<p class="text-[12.5px] text-black/40 mt-1.5 font-medium">${p.tags}</p>`:''}</div></article>`).join('')}
function toggleLike(id,btn){const p=DB.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;if(btn){btn.classList.remove('liked-pop');void btn.offsetWidth;btn.classList.add('liked-pop')}renderFeed()}
function toggleSave(id){const p=DB.posts.find(x=>x.id===id);if(!p)return;p.saved=!p.saved;toast(p.saved?'Сохранено':'Убрано');renderFeed()}
function openComments(postId){DB.activePostComments=postId;const p=DB.posts.find(x=>x.id===postId);document.getElementById('comments-list').innerHTML=(p.commentList||[]).map(c=>`<div class="flex gap-3"><div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-[13px] font-semibold shrink-0 text-white/80">${c.user[0]}</div><div class="flex-1 min-w-0"><p class="text-[13px] font-semibold">${c.user}</p><p class="text-[13.5px] text-white/65 mt-0.5 leading-snug">${c.text}</p></div></div>`).join('')||'<p class="text-center text-white/35 py-8 text-[14px]">Пока нет комментариев</p>';document.getElementById('backdrop').classList.add('open');document.getElementById('comments-sheet').classList.add('open');setNavVisible(false)}
function addComment(){const input=document.getElementById('comment-input');const text=input.value.trim();if(!text||!DB.activePostComments)return;const p=DB.posts.find(x=>x.id===DB.activePostComments);p.commentList.push({user:'Вы',text});p.comments++;input.value='';openComments(p.id);renderFeed()}
function renderNotifs(){const list=DB.notifications.filter(n=>DB.notifTab==='all'||n.cat===DB.notifTab);document.getElementById('notif-list').innerHTML=list.map(n=>`<div class="flex gap-3.5 p-3.5 rounded-2xl ${n.read?'bg-white/[0.03]':'bg-white/[0.07]'} border border-white/[0.04]"><div class="w-12 h-12 rounded-full overflow-hidden bg-white/10 shrink-0 flex items-center justify-center">${n.avatar?`<img src="${n.avatar}" class="w-full h-full object-cover">`:'🔔'}</div><div class="flex-1 min-w-0 pt-0.5"><p class="text-[14px] leading-snug"><span class="font-semibold">${n.title}</span> <span class="text-white/60">${n.body}</span></p><p class="text-[12px] text-white/35 mt-1 font-medium">${n.time}</p></div>${!n.read?'<span class="w-2 h-2 rounded-full bg-[#a855f7] shrink-0 mt-2"></span>':''}</div>`).join('')||'<p class="text-center text-white/35 py-12">Нет уведомлений</p>';document.getElementById('notif-dot').style.display=DB.notifications.some(n=>!n.read)?'':'none'}
function markAllRead(){DB.notifications.forEach(n=>n.read=true);renderNotifs();toast('Все прочитаны')}
document.getElementById('notif-tabs').addEventListener('click',e=>{const btn=e.target.closest('[data-tab]');if(!btn)return;DB.notifTab=btn.dataset.tab;document.querySelectorAll('.notif-tab').forEach(b=>{const on=b.dataset.tab===DB.notifTab;b.className='notif-tab px-4 py-1.5 rounded-full text-[13px] '+(on?'font-semibold bg-white text-black':'font-medium glass text-white/70')});renderNotifs()});
function renderChats(){const q=(document.getElementById('msg-search')?.value||'').toLowerCase();const list=DB.chats.filter(c=>!q||c.name.toLowerCase().includes(q));document.getElementById('chats-list').innerHTML=list.map(c=>`<button class="w-full flex items-center gap-3.5 px-4 py-3.5 press text-left" onclick="go('chat',{chatId:'${c.id}'})"><img src="${c.avatar}" class="w-14 h-14 rounded-full object-cover ring-2 ring-white/5" alt=""><div class="flex-1 min-w-0"><div class="flex justify-between items-baseline gap-2"><p class="text-[15px] font-semibold truncate">${c.name}</p><span class="text-[11px] text-white/35 shrink-0 font-medium">${c.time}</span></div><p class="text-[13.5px] text-white/45 truncate mt-0.5">${c.last}</p></div>${c.unread?`<span class="min-w-[20px] h-5 px-1.5 rounded-full text-[11px] font-bold flex items-center justify-center shrink-0" style="background:linear-gradient(135deg,#a855f7,#ec4899)">${c.unread}</span>`:''}</button>`).join('');const unread=DB.chats.reduce((s,c)=>s+c.unread,0);const badge=document.getElementById('msg-badge');if(unread){badge.textContent=unread;badge.classList.remove('hidden')}else badge.classList.add('hidden')}
function openChat(id){const c=DB.chats.find(x=>x.id===id);if(!c)return;DB.activeChat=id;c.unread=0;document.getElementById('chat-avatar').src=c.avatar;document.getElementById('chat-name').textContent=c.name;const box=document.getElementById('chat-messages');box.innerHTML=c.messages.map(m=>`<div class="flex ${m.me?'justify-end':''}"><div class="max-w-[78%] px-4 py-2.5 text-[14.5px] leading-snug ${m.me?'chat-bubble-me':'chat-bubble-them'}">${m.text}</div></div>`).join('');box.scrollTop=box.scrollHeight}
function sendMsg(){const input=document.getElementById('chat-input');const text=input.value.trim();if(!text||!DB.activeChat)return;const c=DB.chats.find(x=>x.id===DB.activeChat);c.messages.push({me:true,text});c.last=text;c.time='сейчас';input.value='';openChat(c.id)}
function renderExplore(){const q=(document.getElementById('explore-q')?.value||'').toLowerCase();const tab=DB.exploreTab;let html='';const people=DB.explore.people.filter(p=>!q||p.name.toLowerCase().includes(q));const channels=DB.explore.channels.filter(c=>!q||c.name.toLowerCase().includes(q));const shops=DB.explore.shops.filter(s=>!q||s.name.toLowerCase().includes(q));if(tab==='all'||tab==='people'){if(people.length)html+=`<p class="text-[11px] text-white/35 uppercase tracking-wider font-semibold mb-2.5">Люди</p>`+people.map(p=>`<button class="w-full flex items-center gap-3.5 p-3 rounded-2xl bg-white/[0.04] border border-white/[0.04] press mb-2" onclick="go('profile')"><img src="${p.avatar}" class="w-12 h-12 rounded-full object-cover"><div class="text-left"><p class="text-[15px] font-semibold">${p.name}</p><p class="text-[12.5px] text-white/40">${p.handle}</p></div></button>`).join('')}
if(tab==='all'||tab==='channels'){if(channels.length)html+=`<p class="text-[11px] text-white/35 uppercase tracking-wider font-semibold mb-2.5 mt-4">Каналы</p>`+channels.map(c=>`<div class="p-4 rounded-2xl bg-white/[0.04] border border-white/[0.04] mb-2"><p class="text-[15px] font-semibold">${c.name}</p><p class="text-[12.5px] text-white/40 mt-0.5">${c.desc} · ${c.members}</p></div>`).join('')}
if(tab==='all'||tab==='shops'){if(shops.length)html+=`<p class="text-[11px] text-white/35 uppercase tracking-wider font-semibold mb-2.5 mt-4">Магазины</p>`+shops.map(s=>`<div class="p-4 rounded-2xl bg-white/[0.04] border border-white/[0.04] mb-2"><p class="text-[15px] font-semibold">${s.name}</p><p class="text-[12.5px] text-white/40 mt-0.5">${s.desc} · ${s.products} товаров</p></div>`).join('')}
document.getElementById('explore-results').innerHTML=html||'<p class="text-center text-white/35 py-12">Ничего не найдено</p>'}
document.getElementById('explore-tabs').addEventListener('click',e=>{const btn=e.target.closest('[data-etab]');if(!btn)return;DB.exploreTab=btn.dataset.etab;document.querySelectorAll('.etab').forEach(b=>{const on=b.dataset.etab===DB.exploreTab;b.className='etab px-4 py-1.5 rounded-full text-[13px] '+(on?'font-semibold bg-white text-black':'font-medium glass text-white/70')});renderExplore()});
function renderSettings(){const groups=[{title:'Аккаунт',items:['Профиль и имя','Конфиденциальность','Блокировки']},{title:'Безопасность',items:['Двухфакторная аутентификация','Активные сессии']},{title:'Уведомления',items:['Push-уведомления','Категории событий']},{title:'Данные',items:['Экспорт данных','Удаление аккаунта']}];document.getElementById('settings-body').innerHTML=groups.map(g=>`<div><p class="text-[11px] text-white/35 uppercase tracking-wider font-semibold mb-2.5 px-1">${g.title}</p><div class="rounded-2xl bg-white/[0.04] border border-white/[0.04] overflow-hidden divide-y divide-white/[0.04]">${g.items.map(i=>`<button class="w-full text-left px-4 py-3.5 text-[14.5px] press flex justify-between items-center" onclick="toast('${i}')"><span>${i}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>`).join('')}</div></div>`).join('')}
function openCreate(){document.getElementById('create-options').innerHTML=[['Пост','Публикация в ленту','📝'],['История','Атлас на 24 часа','✦'],['Канал','Пространство для аудитории','📡'],['Магазин','Каталог и заказы','🛍'],['Сообщество','Открытая или закрытая группа','👥']].map(([t,d,i])=>`<button class="w-full flex items-center gap-3.5 px-3 py-3.5 rounded-2xl press text-left" onclick="closeSheet();toast('${t}: скоро')"><div class="w-11 h-11 rounded-xl bg-white/[0.07] flex items-center justify-center text-[18px]">${i}</div><div><p class="text-[15px] font-semibold">${t}</p><p class="text-[12.5px] text-white/40 mt-0.5">${d}</p></div></button>`).join('');document.getElementById('backdrop').classList.add('open');document.getElementById('create-sheet').classList.add('open');setNavVisible(false)}
function closeSheet(){document.getElementById('backdrop').classList.remove('open');document.getElementById('create-sheet').classList.remove('open');document.getElementById('comments-sheet').classList.remove('open');setNavVisible(true)}
function toggleFollow(){DB.following=!DB.following;const btn=document.getElementById('btn-follow');btn.textContent=DB.following?'Вы подписаны':'Подписаться';if(DB.following){btn.className='flex-1 max-w-[230px] h-[50px] rounded-full glass text-white font-semibold text-[15px] press'}else{btn.className='flex-1 max-w-[230px] h-[50px] rounded-full bg-white text-black font-semibold text-[15px] press shadow-lg shadow-white/10'}toast(DB.following?'Подписка оформлена':'Подписка отменена')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2000)}
renderStories();renderFeed();renderNotifs();renderChats();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
