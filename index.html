<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Atlantis"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="Atlantis"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
<title>Atlantis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
#app{height:100%;height:100dvh;height:100svh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:#000;padding-bottom:env(safe-area-inset-bottom,0px)}
.ns{scrollbar-width:none}
.ns::-webkit-scrollbar{display:none}
.press:active{opacity:.85;transform:scale(.98)}
.story-ring{background:linear-gradient(135deg,#a855f7,#ec4899,#f97316)}
.post-card{border-radius:20px;overflow:hidden;background:#111}
.nav-item{transition:all .15s}
.nav-item.active{background:#fff;color:#000}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="px-5 pt-4 pb-3 flex items-center justify-between shrink-0">
    <h1 class="text-[28px] font-bold tracking-tight">
      <span class="bg-gradient-to-r from-[#a855f7] via-[#ec4899] to-[#f97316] bg-clip-text text-transparent">Atlantis</span>
    </h1>
    <button class="w-10 h-10 rounded-full flex items-center justify-center text-white/80 press relative">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>
  </header>

  <!-- Stories / Atlases -->
  <section class="px-5 pb-4 shrink-0">
    <div class="flex gap-4 overflow-x-auto ns -mx-1 px-1 pb-1">
      <!-- Add -->
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full bg-[#1a1a1a] border border-white/10 flex items-center justify-center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white/60"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <span class="text-[11px] text-white/50">Добавить</span>
      </button>
      <!-- Alfredo -->
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">
          <img src="https://i.pravatar.cc/140?u=alfredo" class="w-full h-full rounded-full object-cover border-[2.5px] border-black" alt="">
        </div>
        <span class="text-[11px] text-white/80">Альфредо</span>
      </button>
      <!-- Korsgaard -->
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">
          <div class="w-full h-full rounded-full bg-[#2a2a2a] border-[2.5px] border-black flex items-center justify-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="text-white/30"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
        </div>
        <span class="text-[11px] text-white/80">Корсгард</span>
      </button>
      <!-- Ashlynn -->
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">
          <img src="https://i.pravatar.cc/140?u=ashlynn" class="w-full h-full rounded-full object-cover border-[2.5px] border-black" alt="">
        </div>
        <span class="text-[11px] text-white/80">Эшлинн</span>
      </button>
      <!-- Extra -->
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">
          <img src="https://i.pravatar.cc/140?u=adams" class="w-full h-full rounded-full object-cover border-[2.5px] border-black" alt="">
        </div>
        <span class="text-[11px] text-white/80">Адамс</span>
      </button>
      <button class="flex flex-col items-center gap-1.5 shrink-0 press">
        <div class="w-[68px] h-[68px] rounded-full story-ring p-[2.5px]">
          <img src="https://i.pravatar.cc/140?u=mia" class="w-full h-full rounded-full object-cover border-[2.5px] border-black" alt="">
        </div>
        <span class="text-[11px] text-white/80">Миа</span>
      </button>
    </div>
  </section>

  <!-- Feed -->
  <main class="flex-1 overflow-y-auto ns px-4 pb-24 space-y-4">

    <!-- Post 1 -->
    <article class="post-card fade">
      <div class="relative aspect-[4/5] max-h-[420px]">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" class="w-full h-full object-cover" alt="">
        <div class="absolute top-3.5 left-3.5 flex items-center gap-2">
          <img src="https://i.pravatar.cc/48?u=sofia" class="w-8 h-8 rounded-full object-cover border-2 border-white/20" alt="">
          <span class="text-[13px] font-semibold text-white drop-shadow">София Беннетт</span>
        </div>
        <div class="absolute bottom-3.5 left-3.5 flex items-center gap-2">
          <button class="flex items-center gap-1.5 bg-black/40 backdrop-blur-md rounded-full px-3 py-1.5 press">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span class="text-[12px] font-medium text-white">18</span>
          </button>
        </div>
        <div class="absolute bottom-3.5 right-3.5 flex -space-x-2">
          <img src="https://i.pravatar.cc/32?u=1" class="w-6 h-6 rounded-full border-2 border-black object-cover" alt="">
          <img src="https://i.pravatar.cc/32?u=2" class="w-6 h-6 rounded-full border-2 border-black object-cover" alt="">
          <img src="https://i.pravatar.cc/32?u=3" class="w-6 h-6 rounded-full border-2 border-black object-cover" alt="">
        </div>
      </div>
      <div class="px-4 py-3.5 bg-[#0f0f0f]">
        <div class="flex items-center gap-2 mb-2">
          <img src="https://i.pravatar.cc/48?u=sofia" class="w-6 h-6 rounded-full object-cover" alt="">
          <span class="text-[13px] font-semibold">София Беннетт</span>
        </div>
        <p class="text-[13.5px] leading-relaxed text-white/90">
          Просто хороший день. Солнце, ветер и ничего лишнего.
        </p>
      </div>
    </article>

    <!-- Post 2 -->
    <article class="post-card fade">
      <div class="relative aspect-[4/5] max-h-[420px]">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=80" class="w-full h-full object-cover" alt="">
        <div class="absolute top-3.5 left-3.5 flex items-center gap-2">
          <img src="https://i.pravatar.cc/48?u=max" class="w-8 h-8 rounded-full object-cover border-2 border-white/20" alt="">
          <span class="text-[13px] font-semibold text-white drop-shadow">Макс Уокер</span>
        </div>
        <div class="absolute bottom-3.5 left-3.5 flex items-center gap-2">
          <button class="flex items-center gap-1.5 bg-black/40 backdrop-blur-md rounded-full px-3 py-1.5 press">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span class="text-[12px] font-medium text-white">42</span>
          </button>
        </div>
        <div class="absolute bottom-3.5 right-3.5 flex -space-x-2">
          <img src="https://i.pravatar.cc/32?u=4" class="w-6 h-6 rounded-full border-2 border-black object-cover" alt="">
          <img src="https://i.pravatar.cc/32?u=5" class="w-6 h-6 rounded-full border-2 border-black object-cover" alt="">
        </div>
      </div>
      <div class="px-4 py-3.5 bg-[#0f0f0f]">
        <div class="flex items-center gap-2 mb-2">
          <img src="https://i.pravatar.cc/48?u=max" class="w-6 h-6 rounded-full object-cover" alt="">
          <span class="text-[13px] font-semibold">Макс Уокер</span>
        </div>
        <p class="text-[13.5px] leading-relaxed text-white/90">
          Горы всегда знают, когда тебе нужно выдохнуть. #nature
        </p>
      </div>
    </article>

    <!-- Post 3 -->
    <article class="post-card fade">
      <div class="relative aspect-[4/5] max-h-[420px]">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80" class="w-full h-full object-cover" alt="">
        <div class="absolute top-3.5 left-3.5 flex items-center gap-2">
          <img src="https://i.pravatar.cc/48?u=lena" class="w-8 h-8 rounded-full object-cover border-2 border-white/20" alt="">
          <span class="text-[13px] font-semibold text-white drop-shadow">Лена Морозова</span>
        </div>
        <div class="absolute bottom-3.5 left-3.5 flex items-center gap-2">
          <button class="flex items-center gap-1.5 bg-black/40 backdrop-blur-md rounded-full px-3 py-1.5 press">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span class="text-[12px] font-medium text-white">9</span>
          </button>
        </div>
      </div>
      <div class="px-4 py-3.5 bg-[#0f0f0f]">
        <div class="flex items-center gap-2 mb-2">
          <img src="https://i.pravatar.cc/48?u=lena" class="w-6 h-6 rounded-full object-cover" alt="">
          <span class="text-[13px] font-semibold">Лена Морозова</span>
        </div>
        <p class="text-[13.5px] leading-relaxed text-white/90">
          Ночной город. Тишина между огнями.
        </p>
      </div>
    </article>

  </main>

  <!-- Bottom Nav -->
  <nav class="absolute bottom-0 left-0 right-0 px-5 pt-2 bg-gradient-to-t from-black via-black/95 to-transparent" style="padding-bottom: max(10px, env(safe-area-inset-bottom));">
    <div class="flex items-center justify-between bg-[#1a1a1a]/90 backdrop-blur-xl rounded-full px-1.5 py-1.5 border border-white/5 max-w-[300px] mx-auto">
      <!-- Home active -->
      <button class="nav-item active w-14 h-14 rounded-full flex items-center justify-center press">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>
      <!-- Gallery -->
      <button class="nav-item w-14 h-14 rounded-full flex items-center justify-center text-white/50 press hover:text-white">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <!-- Activity -->
      <button class="nav-item w-14 h-14 rounded-full flex items-center justify-center text-white/50 press hover:text-white">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <!-- Profile -->
      <button class="nav-item w-14 h-14 rounded-full flex items-center justify-center text-white/50 press hover:text-white">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
  </nav>

</div>

<!-- iOS Install Banner (only when not installed) -->
<div id="ios-install" class="hidden fixed bottom-28 left-4 right-4 z-50 max-w-[400px] mx-auto">
  <div class="bg-[#1c1c1e]/95 backdrop-blur-xl border border-white/10 rounded-2xl p-4 shadow-2xl flex items-start gap-3">
    <div class="w-12 h-12 rounded-xl overflow-hidden shrink-0 bg-black flex items-center justify-center">
      <img src="/apple-touch-icon.png" alt="" class="w-full h-full object-cover">
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-[15px] font-semibold text-white leading-tight">Установить Atlantis</p>
      <p class="text-[13px] text-white/60 mt-0.5 leading-snug">Нажми <span class="inline-flex items-center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-0.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></span> → «На экран «Домой»»</p>
    </div>
    <button onclick="document.getElementById('ios-install').classList.add('hidden')" class="text-white/40 press p-1">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

(function() {
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (isIos && !isStandalone) {
    const banner = document.getElementById('ios-install');
    if (banner) banner.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
