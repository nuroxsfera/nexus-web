<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Atlantis"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<title>Atlantis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:#000;overflow:hidden}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
.press{transition:transform .15s,opacity .12s}.press:active{transform:scale(.96);opacity:.88}
.story-ring{background:conic-gradient(from 210deg,#a855f7,#ec4899,#f97316,#a855f7);padding:2.5px;border-radius:999px}
.story-ring.seen{background:#333}
.post-card{border-radius:28px;overflow:hidden;background:#f2f2f4;color:#0a0a0a;box-shadow:0 6px 32px rgba(0,0,0,.3)}
.nav-item{transition:all .18s;color:rgba(255,255,255,.4)}.nav-item.active{background:#fff;color:#000}
#bnav{transition:opacity .22s,transform .28s}#bnav.hide{opacity:0;pointer-events:none;transform:translateY(20px)}
.view{display:none;flex-direction:column;height:100%;min-height:0}.view.active{display:flex}
.hero{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.85) 75%,#000)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:#121214;border-radius:24px 24px 0 0;padding:8px 16px 0;transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.85,.2,1);max-height:88vh;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.06)}
.sheet.open{transform:translateY(0)}.handle{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:6px auto 12px;flex-shrink:0}
.sbody{flex:1;overflow-y:auto;min-height:0}.sfoot{flex-shrink:0;padding:10px 0;padding-bottom:max(12px,var(--sb))}
.bd{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}.bd.open{opacity:1;pointer-events:auto}
.me{background:linear-gradient(135deg,#a855f7,#c026d3);color:#fff;border-radius:18px 18px 4px 18px}
.them{background:#1c1c1e;color:#fff;border-radius:18px 18px 18px 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);z-index:80;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.94);color:#000;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .28s;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gt{background:linear-gradient(135deg,#c084fc,#f472b6,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1)}
#story-viewer{position:absolute;inset:0;z-index:90;background:#000;display:none;flex-direction:column}
#story-viewer.on{display:flex}
.sv-bar{height:3px;background:rgba(255,255,255,.25);border-radius:2px;flex:1;overflow:hidden}
.sv-fill{height:100%;background:#fff;width:0;border-radius:2px}
.compose-area{min-height:100px;background:transparent;color:#fff;border:none;outline:none;resize:none;font-size:16px;line-height:1.45;width:100%}
</style>
</head>
<body>
<div id="app">

<div id="view-home" class="view active">
<header class="px-5 pb-2 flex items-center justify-between shrink-0" style="padding-top:max(12px,var(--st))">
<h1 class="text-[28px] font-extrabold leading-none"><span class="gt">Atlantis</span></h1>
<button onclick="go('notifications')" class="w-10 h-10 rounded-full glass flex items-center justify-center press relative">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
<span id="ndot" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full ring-2 ring-black"></span>
</button>
</header>
<section class="px-4 pb-2 shrink-0">
<p class="text-[11px] text-white/40 mb-2.5 font-medium uppercase tracking-wide px-1">Ваши Атласы</p>
<div class="flex gap-3 overflow-x-auto ns" id="stories"></div>
</section>
<main class="flex-1 overflow-y-auto ns px-3 space-y-3.5" style="padding-bottom:calc(86px + var(--sb))" id="feed"></main>
</div>

<div id="view-profile" class="view relative overflow-hidden">
<div class="hero" id="prof-hero"></div>
<div class="relative z-10 flex items-center justify-between px-4" style="padding-top:max(12px,var(--st))">
<button onclick="go('home')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<button onclick="go('settings')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
</div>
<div class="flex-1"></div>
<div class="relative z-10 px-5" style="padding-bottom:calc(92px + var(--sb))">
<div class="text-center mb-4">
<h2 id="prof-name" class="text-[28px] font-bold drop-shadow-lg"></h2>
<p id="prof-handle" class="text-[13px] text-white/55 mt-0.5"></p>
</div>
<div class="flex justify-center gap-3 mb-5" id="prof-actions"></div>
<div class="flex justify-center gap-10 mb-4" id="prof-stats"></div>
<div class="glass rounded-2xl px-4 py-3 mb-4"><p id="prof-bio" class="text-[13px] text-white/75 text-center leading-relaxed"></p></div>
</div>
</div>

<div id="view-me" class="view relative overflow-hidden">
<div class="hero" style="background-image:url('https://picsum.photos/seed/mehero/1200/1600')"></div>
<div class="relative z-10 flex items-center justify-between px-4" style="padding-top:max(12px,var(--st))">
<span class="text-[15px] font-semibold">Мой профиль</span>
<button onclick="go('settings')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
</div>
<div class="flex-1"></div>
<div class="relative z-10 px-5" style="padding-bottom:calc(92px + var(--sb))">
<div class="text-center mb-4">
<h2 class="text-[28px] font-bold" id="me-name">Вы</h2>
<p class="text-[13px] text-white/55 mt-0.5" id="me-handle">@you</p>
</div>
<button onclick="openEditProfile()" class="w-full max-w-[240px] mx-auto h-11 rounded-full glass text-white font-semibold text-[14px] press mb-5 block">Редактировать</button>
<div class="flex justify-center gap-10 mb-4">
<div class="text-center"><p class="text-[20px] font-bold" id="me-posts">0</p><p class="text-[11px] text-white/45">Посты</p></div>
<div class="text-center"><p class="text-[20px] font-bold">128</p><p class="text-[11px] text-white/45">Подписки</p></div>
<div class="text-center"><p class="text-[20px] font-bold">56</p><p class="text-[11px] text-white/45">Подписчики</p></div>
</div>
<div class="glass rounded-2xl px-4 py-3"><p class="text-[13px] text-white/75 text-center" id="me-bio">Привет, я в Atlantis 🌊</p></div>
</div>
</div>

<div id="view-channel" class="view">
<header class="shrink-0" style="padding-top:max(6px,var(--st))">
<div class="relative h-[140px] overflow-hidden">
<img id="ch-cover" class="w-full h-full object-cover" alt="">
<div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent"></div>
<button onclick="go('explore')" class="absolute top-2 left-3 w-10 h-10 rounded-full glass flex items-center justify-center press z-10"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
</div>
<div class="px-4 -mt-7 relative z-10">
<div class="flex items-end gap-3 mb-2">
<img id="ch-av" class="w-14 h-14 rounded-2xl object-cover ring-4 ring-black" alt="">
<div class="flex-1 pb-0.5"><h2 id="ch-name" class="text-[20px] font-bold"></h2><p id="ch-meta" class="text-[12px] text-white/45"></p></div>
</div>
<p id="ch-desc" class="text-[13px] text-white/55 mb-3"></p>
<button id="ch-sub" onclick="toggleChSub()" class="w-full h-10 rounded-full bg-white text-black font-semibold text-[14px] press mb-3">Подписаться</button>
</div>
</header>
<div class="flex-1 overflow-y-auto ns px-3 space-y-3" style="padding-bottom:calc(86px + var(--sb))" id="ch-posts"></div>
</div>

<div id="view-shop" class="view">
<header class="px-4 pb-2" style="padding-top:max(12px,var(--st))">
<div class="flex items-center gap-3 mb-2">
<button onclick="go('explore')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<div class="flex-1"><h2 id="sh-name" class="text-[18px] font-bold"></h2><p id="sh-meta" class="text-[12px] text-white/45"></p></div>
<button onclick="openCart()" class="w-10 h-10 rounded-full glass flex items-center justify-center press relative">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
<span id="cart-n" class="hidden absolute -top-0.5 -right-0.5 min-w-[15px] h-4 px-1 bg-red-500 rounded-full text-[9px] font-bold flex items-center justify-center">0</span>
</button>
</div>
<p id="sh-desc" class="text-[12.5px] text-white/50 px-1"></p>
</header>
<div class="flex-1 overflow-y-auto ns px-3" style="padding-bottom:calc(86px + var(--sb))"><div class="grid grid-cols-2 gap-2.5" id="sh-grid"></div></div>
</div>

<div id="view-notifications" class="view">
<header class="px-4 pb-2 flex items-center gap-2" style="padding-top:max(12px,var(--st))">
<button onclick="go('home')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[20px] font-bold flex-1">Уведомления</h2>
<button class="text-[12px] text-white/45 press" onclick="markRead()">Прочитать</button>
</header>
<div class="flex-1 overflow-y-auto ns px-3 space-y-2" style="padding-bottom:calc(86px + var(--sb))" id="nlist"></div>
</div>

<div id="view-messages" class="view">
<header class="px-4 pb-2" style="padding-top:max(12px,var(--st))"><h2 class="text-[24px] font-bold">Сообщения</h2></header>
<div class="px-3 pb-2"><div class="flex items-center gap-2 glass rounded-2xl px-3.5 py-2.5">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="csearch" type="search" placeholder="Поиск" class="bg-transparent outline-none text-[14px] flex-1 placeholder:text-white/30" oninput="renderChats()">
</div></div>
<div class="flex-1 overflow-y-auto ns" style="padding-bottom:calc(86px + var(--sb))" id="clist"></div>
</div>

<div id="view-chat" class="view">
<header class="px-2 pb-2 flex items-center gap-2 border-b border-white/5" style="padding-top:max(10px,var(--st))">
<button onclick="go('messages')" class="w-10 h-10 rounded-full flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<img id="cv-av" class="w-9 h-9 rounded-full object-cover" alt="">
<div class="flex-1 min-w-0"><p id="cv-name" class="text-[14px] font-semibold truncate"></p><p class="text-[11px] text-emerald-400/90">в сети</p></div>
</header>
<div class="flex-1 overflow-y-auto ns px-3 py-3 space-y-2" id="cmsgs"></div>
<div class="px-2.5 pt-1.5 flex items-center gap-2" style="padding-bottom:max(10px,var(--sb))">
<input id="cinput" type="text" placeholder="Сообщение…" class="flex-1 bg-[#1a1a1c] rounded-full px-4 py-2.5 text-[14px] outline-none border border-white/5" onkeydown="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()" class="w-10 h-10 rounded-full flex items-center justify-center press shrink-0" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>

<div id="view-explore" class="view">
<header class="px-3 pb-2" style="padding-top:max(12px,var(--st))">
<div class="flex items-center gap-2 glass rounded-2xl px-3.5 py-2.5">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="eq" type="search" placeholder="Люди, каналы, магазины…" class="bg-transparent outline-none text-[14px] flex-1 placeholder:text-white/30" oninput="renderExplore()">
</div></header>
<div class="flex gap-2 px-3 pb-2 overflow-x-auto ns" id="etabs">
<button data-t="all" class="etab px-3.5 py-1.5 rounded-full text-[12px] font-semibold bg-white text-black">Все</button>
<button data-t="channels" class="etab px-3.5 py-1.5 rounded-full text-[12px] font-medium glass text-white/70">Каналы</button>
<button data-t="shops" class="etab px-3.5 py-1.5 rounded-full text-[12px] font-medium glass text-white/70">Магазины</button>
</div>
<div class="flex-1 overflow-y-auto ns px-3 space-y-2" style="padding-bottom:calc(86px + var(--sb))" id="eres"></div>
</div>

<div id="view-settings" class="view">
<header class="px-4 pb-2 flex items-center gap-2" style="padding-top:max(12px,var(--st))">
<button onclick="go('me')" class="w-10 h-10 rounded-full glass flex items-center justify-center press"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
<h2 class="text-[20px] font-bold">Настройки</h2>
</header>
<div class="flex-1 overflow-y-auto ns px-3 space-y-5" style="padding-bottom:calc(86px + var(--sb))" id="sbody"></div>
</div>

<div id="view-compose" class="view">
<header class="px-4 pb-2 flex items-center gap-3" style="padding-top:max(12px,var(--st))">
<button onclick="go('home')" class="text-[14px] text-white/50 press">Отмена</button>
<span class="flex-1 text-center text-[16px] font-semibold">Новый пост</span>
<button onclick="publishPost()" class="text-[14px] font-semibold press" style="color:#c084fc">Опубликовать</button>
</header>
<div class="flex-1 px-4 pt-2">
<textarea id="compose-text" class="compose-area" placeholder="Что у вас нового?" maxlength="500"></textarea>
<div class="mt-3 flex gap-2 flex-wrap" id="compose-imgs"></div>
<button onclick="addComposeImg()" class="mt-3 flex items-center gap-2 text-[13px] text-white/50 press">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
Добавить фото
</button>
</div>
</div>

<div id="story-viewer">
<div class="flex gap-1 px-2 pt-2" style="padding-top:max(10px,var(--st))" id="sv-bars"></div>
<div class="flex items-center gap-2 px-3 py-2">
<img id="sv-av" class="w-8 h-8 rounded-full object-cover" alt="">
<span id="sv-name" class="text-[13px] font-semibold flex-1"></span>
<button onclick="closeStory()" class="w-8 h-8 flex items-center justify-center press"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</div>
<div class="flex-1 relative" id="sv-img-wrap" onclick="nextStory()">
<img id="sv-img" class="absolute inset-0 w-full h-full object-cover" alt="">
</div>
</div>

<div id="bd" class="bd" onclick="closeSheet()"></div>

<div id="create-sheet" class="sheet">
<div class="handle"></div>
<p class="text-[16px] font-semibold mb-2">Создать</p>
<div class="sbody space-y-0.5 pb-2" id="create-opts"></div>
<div class="sfoot"></div>
</div>

<div id="comments-sheet" class="sheet">
<div class="handle"></div>
<p class="text-[16px] font-semibold mb-2">Комментарии</p>
<div class="sbody space-y-3 pb-2" id="clist-c"></div>
<div class="sfoot"><div class="flex gap-2">
<input id="cminput" type="text" placeholder="Комментарий…" class="flex-1 bg-[#1a1a1c] rounded-full px-4 py-2.5 text-[13px] outline-none border border-white/5" onkeydown="if(event.key==='Enter')addCm()">
<button onclick="addCm()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center press font-bold">↑</button>
</div></div>
</div>

<div id="product-sheet" class="sheet">
<div class="handle"></div>
<div class="sbody pb-2" id="pdetail"></div>
<div class="sfoot" id="pfoot"></div>
</div>

<div id="cart-sheet" class="sheet">
<div class="handle"></div>
<p class="text-[16px] font-semibold mb-2">Корзина</p>
<div class="sbody space-y-3 pb-2" id="cart-list"></div>
<div class="sfoot" id="cart-foot"></div>
</div>

<div id="edit-sheet" class="sheet">
<div class="handle"></div>
<p class="text-[16px] font-semibold mb-3">Редактировать профиль</p>
<div class="sbody space-y-3 pb-2">
<label class="text-[12px] text-white/40">Имя</label>
<input id="edit-name" class="w-full bg-[#1a1a1c] rounded-xl px-4 py-3 text-[14px] outline-none border border-white/5">
<label class="text-[12px] text-white/40">Username</label>
<input id="edit-handle" class="w-full bg-[#1a1a1c] rounded-xl px-4 py-3 text-[14px] outline-none border border-white/5">
<label class="text-[12px] text-white/40">О себе</label>
<textarea id="edit-bio" rows="3" class="w-full bg-[#1a1a1c] rounded-xl px-4 py-3 text-[14px] outline-none border border-white/5 resize-none"></textarea>
</div>
<div class="sfoot"><button onclick="saveProfile()" class="w-full h-11 rounded-full bg-white text-black font-semibold text-[14px] press">Сохранить</button></div>
</div>

<nav id="bnav" class="absolute bottom-0 left-0 right-0 px-3 z-30" style="padding-bottom:max(5px,calc(var(--sb)*.55))">
<div class="flex items-center justify-between rounded-full px-1 py-0.5 max-w-[300px] mx-auto" style="background:rgba(22,22,24,.92);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.07)">
<button data-r="home" class="nav-btn nav-item active w-11 h-11 rounded-full flex items-center justify-center press" onclick="go('home')"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>
<button data-r="explore" class="nav-btn nav-item w-11 h-11 rounded-full flex items-center justify-center press" onclick="go('explore')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg></button>
<button class="w-11 h-11 rounded-full flex items-center justify-center press" onclick="openCreate()"><div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#a855f7,#ec4899)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg></div></button>
<button data-r="messages" class="nav-btn nav-item w-11 h-11 rounded-full flex items-center justify-center press relative" onclick="go('messages')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span id="mbadge" class="hidden absolute top-1 right-1 min-w-[14px] h-3.5 px-1 bg-red-500 rounded-full text-[8px] font-bold flex items-center justify-center">0</span></button>
