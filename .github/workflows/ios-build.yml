name: iOS build

on:
  push:
    branches: [native/ios-swiftui]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/Nexus.xcodeproj -scheme Nexus -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
