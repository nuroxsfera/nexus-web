name: Nexus
options:
  bundleIdPrefix: com.nuroxsfera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: Nexus
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    GENERATE_INFOPLIST_FILE: YES
targets:
  Nexus:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuroxsfera.nexus
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
